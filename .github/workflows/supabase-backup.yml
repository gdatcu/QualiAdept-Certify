name: Supabase Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backup_${TIMESTAMP}.sql"
          echo "Generating database backup to ${BACKUP_FILE} using Docker..."
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" > "${BACKUP_FILE}"
          echo "BACKUP_FILENAME=${BACKUP_FILE}" >> $GITHUB_ENV
          ls -lh "${BACKUP_FILE}"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-backup
          path: ${{ env.BACKUP_FILENAME }}
          retention-days: 30
