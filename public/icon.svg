<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="qGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Dark Mode Container Background -->
  <rect width="100" height="100" rx="24" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Outer Q Circle -->
  <circle cx="50" cy="46" r="26" fill="none" stroke="url(#qGlow)" stroke-width="7.5" stroke-linecap="round" filter="url(#glowFilter)"/>
  
  <!-- Q Tail -->
  <path d="M 60 56 L 76 72" fill="none" stroke="url(#qGlow)" stroke-width="7.5" stroke-linecap="round" filter="url(#glowFilter)"/>
  
  <!-- Certification Checkmark Badge -->
  <path d="M 38 46 L 47 55 L 63 37" fill="none" stroke="url(#qGlow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>
</svg>
